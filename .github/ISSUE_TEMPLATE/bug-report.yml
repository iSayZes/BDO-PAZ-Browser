name: Bug report
description: Something in the browser, CLI or a handler isn't working.
labels:
  - "type: bug 🐛"
  - "status: new 👀"
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the PAZ path or file name involved (e.g. `gamecommondata/binary/title.dbss`) and the command you ran, if any.
      placeholder: |
        1. Open the PAZ folder
        2. Select ...
        3. Switch to the Parsed tab
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Tracebacks or console output. This is rendered as code, so no backticks needed.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version (release or commit)
      description: The version at the bottom right of the window, e.g. `app version v2026.10.12` (also from `bdo-paz-cli.exe --check-app-update`), or from source `app version a1b2c3d`.
    validations:
      required: false
  - type: input
    id: handler
    attributes:
      label: Handler and version
      description: For a parsed table, what the bottom bar shows next to the app version with the file selected, e.g. `buffsimply.bss 2026.10.14`, or from source `buffsimply.bss d2e474f`.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and game region / client language.
      placeholder: Windows 11, Python 3.14, EU client, English
    validations:
      required: false
