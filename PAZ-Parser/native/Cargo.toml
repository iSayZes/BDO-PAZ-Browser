[package]
name = "bdo_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "_bdo_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one .pyd for every CPython from 3.12 up.
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }

[profile.release]
lto = true
codegen-units = 1
