<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BDO PAZ Browser</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-open" class="with-icon" onclick="app.openFolder()"><svg class="icon" aria-hidden="true"><use href="#icon-folder"></use></svg><span data-i18n="toolbar.openFolder">Open PAZ Folder</span></button>
      <span id="folder-path" class="muted" data-i18n="toolbar.noFolderSelected">No folder selected</span>
      <div id="app-update" class="app-update" role="status" hidden>
        <button id="app-update-text" class="app-update-open" onclick="app.openAppUpdate()"></button>
        <button class="app-update-close" onclick="app.dismissAppUpdate()" data-i18n-title="appUpdate.dismiss" title="Dismiss"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
      </div>
      <button id="btn-settings" onclick="app.openSettings()" data-i18n-title="toolbar.settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button>
    </div>
    <div class="sep-h"></div>

    <div id="main">
      <div id="sidebar">
        <div id="search-bar">
          <svg class="icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <input id="search" type="text" placeholder="Filter files…" autocomplete="off" oninput="app.scheduleSearch(this.value)" data-i18n-placeholder="sidebar.filterFiles" disabled />
          <button id="btn-content-search" data-i18n-title="sidebar.searchInFilesTitle" title="Search in file contents" onclick="app.toggleContentSearch()" data-i18n="sidebar.searchInFiles" disabled>Search in all files</button>
        </div>
        <div id="content-search-bar" hidden>
          <div class="csb-row">
            <div class="csb-modes">
              <button id="csb-mode-string" class="csb-mode-btn active" onclick="app._setCsbMode('string')" data-i18n="contentSearch.modeString">String</button>
              <button id="csb-mode-hex" class="csb-mode-btn" onclick="app._setCsbMode('hex')" data-i18n="contentSearch.modeHex">Hex</button>
            </div>
            <input id="csb-input" type="text" placeholder="Pattern…" autocomplete="off" spellcheck="false" data-i18n-placeholder="contentSearch.pattern" />
            <button id="csb-go" onclick="app._runGlobalSearch()" data-i18n="contentSearch.search">Search</button>
            <button id="csb-cancel" class="with-icon" hidden onclick="app.cancelGlobalSearch()"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg><span data-i18n="contentSearch.cancel">Cancel</span></button>
          </div>
          <div class="csb-ext-row">
            <span class="csb-ext-label" data-i18n="contentSearch.in">In:</span>
            <div class="csb-ext-chips">
              <span class="csb-ext-chip active" data-ext=".bss" onclick="app._toggleCsbExt('.bss')">.bss</span>
              <span class="csb-ext-chip active" data-ext=".dbss" onclick="app._toggleCsbExt('.dbss')">.dbss</span>
            </div>
          </div>
        </div>
        <div class="sep-h"></div>
        <div id="tree-container">
          <ul id="tree" class="tree-root"></ul>
        </div>
      </div>

      <div id="v-divider"></div>

      <div id="right-panel">
        <div id="details-panel">
          <div class="details-header">
            <div class="panel-title" data-i18n="details.title">Entry Details</div>
            <button id="btn-export" class="tab-btn with-icon" hidden onclick="app.exportFile()"><svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg><span data-i18n="details.export">Export</span></button>
          </div>
          <div id="detail-grid" class="detail-grid">
            <span class="detail-placeholder" data-i18n="details.noFileSelected">No file selected</span>
          </div>
        </div>

        <div id="h-divider"></div>

        <div id="preview-panel">
          <div class="preview-header">
            <div class="panel-title with-icon" id="preview-title" data-i18n="preview.title">Preview</div>
            <div class="preview-tabs" id="preview-tabs" hidden>
              <button class="tab-btn active" data-tab="hex" onclick="app.switchTab('hex')" data-i18n="preview.tabHex">Hex</button>
              <button class="tab-btn" data-tab="parsed" onclick="app.switchTab('parsed')" data-i18n="preview.tabParsed">Parsed</button>
            </div>
          </div>
          <div id="tab-search-bar" hidden>
            <div class="tsb-modes">
              <button id="tab-search-mode-string" class="tsb-mode-btn active" onclick="app._setTabSearchMode('string')" data-i18n="tabSearch.modeString">String</button>
              <button id="tab-search-mode-hex" class="tsb-mode-btn" onclick="app._setTabSearchMode('hex')" data-i18n="tabSearch.modeHex">Hex</button>
            </div>
            <span class="tsb-prefix" id="tab-search-prefix" hidden>#</span>
            <input id="tab-search-input" type="text" placeholder="Search…" autocomplete="off"
                   oninput="app._onTabSearchInput(event)"
                   onkeydown="app._onTabSearchKeydown(event)"
                   data-i18n-placeholder="tabSearch.placeholder" />
            <button class="tsb-nav-btn" onclick="app.tabSearchPrev()" data-i18n-title="tabSearch.previous" title="Previous (Shift+Enter)"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-up"></use></svg></button>
            <button class="tsb-nav-btn" onclick="app.tabSearchNext()" data-i18n-title="tabSearch.next" title="Next (Enter)"><svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg></button>
            <span id="tab-search-counter"></span>
          </div>
          <div id="preview-content">
            <div class="placeholder" data-i18n="preview.selectFile">Select a file to preview.</div>
          </div>
          <div id="page-bar-area"></div>
        </div>
      </div>
    </div>

    <div class="sep-h"></div>
    <div id="bottom-bar">
      <div id="status-row">
        <span id="status-text"></span>
        <div id="progress-wrap" hidden>
          <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <!-- The app's version, and the selected file's handler with its pack version. -->
        <span id="app-version"></span>
      </div>
      <div id="extract-row">
        <label class="muted" data-i18n="bottomBar.output">Output</label>
        <input id="output-path" type="text" placeholder="Extract destination…" spellcheck="false" data-i18n-placeholder="bottomBar.extractDestination" />
        <button onclick="app.pickOutputFolder()" data-i18n-title="bottomBar.browse" title="Browse">…</button>
        <button class="with-icon" onclick="app.extractSelected()"><svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg><span data-i18n="bottomBar.extractSelected">Extract Selected</span></button>
        <button class="with-icon" onclick="app.extractFolder()"><svg class="icon" aria-hidden="true"><use href="#icon-folder"></use></svg><span data-i18n="bottomBar.extractFolder">Extract Folder</span></button>
        <span id="extract-badge" hidden></span>
      </div>
    </div>

    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-modal" role="dialog" aria-labelledby="settings-title">
        <div class="settings-header">
          <span id="settings-title" data-i18n="settings.title">Settings</span>
          <button class="settings-close" onclick="app.closeSettings()" data-i18n-title="settings.close" title="Close"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="settings-body">
          <label class="settings-label" data-i18n="settings.pazFolder">PAZ Folder</label>
          <div class="settings-path-row">
            <input id="settings-paz-path" type="text" spellcheck="false" />
            <button onclick="app.browseSettingsPazFolder()" data-i18n-title="settings.browse" title="Browse">…</button>
          </div>
          <label class="settings-label" data-i18n="settings.language">Language</label>
          <div class="settings-language-row">
            <!-- Filled from get_settings(), the languages the UI is translated into. -->
            <select id="settings-language" onchange="app.showLanguageLocWarning()"></select>
            <span id="settings-language-warning" class="settings-warning-icon" hidden><svg class="icon" aria-hidden="true"><use href="#icon-warning"></use></svg></span>
          </div>
          <label class="settings-label" data-i18n="settings.tableRowHeight">Table Row Height</label>
          <div class="settings-row-height">
            <input id="settings-table-row-height" type="number" min="20" max="64" step="1" />
            <span class="settings-unit" data-i18n="settings.pixels">px</span>
          </div>
          <label class="settings-check" data-i18n-title="settings.showPaTagsHint" title="Show the &lt;PAColor&gt; tags of game text next to its colours">
            <input id="settings-show-pa-tags" type="checkbox" />
            <span data-i18n="settings.showPaTags">Show game text tags</span>
          </label>
          <label class="settings-check" data-i18n-title="settings.handledOnlyHint" title="Limit the file tree and searches to files with a parsed table view">
            <input id="settings-handled-only" type="checkbox" />
            <span data-i18n="settings.handledOnly">Show only handled tables</span>
          </label>
          <!-- Only in the exe: from source, git pull updates. -->
          <label id="settings-check-app-updates-row" class="settings-check" data-i18n-title="settings.checkAppUpdatesHint" title="Ask GitHub for a newer release when the app starts. Updating always takes a click." hidden>
            <input id="settings-check-app-updates" type="checkbox" />
            <span data-i18n="settings.checkAppUpdates">Check for updates on start</span>
          </label>
          <div id="settings-update-handlers-row" class="settings-handlers-row" hidden>
            <label class="settings-check" data-i18n-title="settings.updateHandlersHint" title="Download new and fixed handlers from GitHub when the app starts. They are used after a restart.">
              <input id="settings-update-handlers" type="checkbox" />
              <span data-i18n="settings.updateHandlers">Update handlers on start</span>
            </label>
            <button id="settings-check-handlers" onclick="app.checkHandlersNow()" data-i18n="settings.checkHandlersNow">Check now</button>
            <span id="settings-handlers-result" class="settings-unit"></span>
          </div>
          <label class="settings-label" for="settings-data-folder" data-i18n="settings.dataFolder">Data Folder</label>
          <div class="settings-path-row">
            <!-- Empty for the default folder, which get_settings() puts in the placeholder. -->
            <input id="settings-data-folder" type="text" spellcheck="false" data-i18n-title="settings.dataFolderHint" title="Where settings and caches are kept, with one cache folder per PAZ folder. Leave empty for the default." />
            <button onclick="app.browseSettingsDataFolder()" data-i18n-title="settings.browse" title="Browse">…</button>
          </div>
          <label class="settings-label" for="settings-records-cache" data-i18n="settings.recordsCache">Parsed Table Cache</label>
          <select id="settings-records-cache" data-i18n-title="settings.recordsCacheHint" title="Keep parsed tables on disk so they reopen without parsing again">
            <option value="off" data-i18n="settings.recordsCacheOff">Off</option>
            <option value="open" data-i18n="settings.recordsCacheOpen">Cache tables when opened</option>
            <option value="all" data-i18n="settings.recordsCacheAll">Cache all tables in the background</option>
          </select>
          <div class="settings-cache-row">
            <button id="settings-delete-caches" onclick="app.deleteCaches()" data-i18n="settings.deleteCaches">Delete all caches</button>
            <span id="settings-cache-size" class="settings-unit"></span>
          </div>
        </div>
        <div class="settings-footer">
          <button onclick="app.closeSettings()" data-i18n="settings.cancel">Cancel</button>
          <button id="settings-save" class="btn-primary" onclick="app.saveSettings()" data-i18n="settings.save">Save</button>
        </div>
      </div>
    </div>

    <div id="icon-preview-overlay" class="settings-overlay" hidden>
      <div class="icon-preview-modal" role="dialog" aria-labelledby="icon-preview-title">
        <div class="settings-header">
          <span id="icon-preview-title" data-i18n="iconPreview.title">Icon</span>
          <button class="settings-close" onclick="app.closeIconPreview()" data-i18n-title="iconPreview.close" title="Close"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="icon-preview-body">
          <div id="icon-preview-status" class="icon-preview-status"></div>
          <figure id="icon-preview-sprite" class="icon-preview-figure" hidden>
            <img id="icon-preview-sprite-image" class="icon-preview-image" alt="" />
            <figcaption data-i18n="iconPreview.sprite">Sprite</figcaption>
          </figure>
          <figure id="icon-preview-full" class="icon-preview-figure" hidden>
            <div class="icon-preview-frame">
              <img id="icon-preview-image" class="icon-preview-image" alt="" />
              <div id="icon-preview-region" class="icon-preview-region" hidden></div>
            </div>
            <figcaption id="icon-preview-caption"></figcaption>
          </figure>
          <div id="icon-preview-path" class="icon-preview-path"></div>
        </div>
      </div>
    </div>

    <div id="loc-warning" class="loc-warning" role="status" hidden>
      <span id="loc-warning-text"></span>
      <button class="loc-warning-close" onclick="app.dismissLocWarning()" data-i18n-title="locWarning.dismiss" title="Dismiss"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
    </div>

    <div id="app-update-overlay" class="settings-overlay" hidden>
      <div class="settings-modal app-update-modal" role="dialog" aria-labelledby="app-update-title">
        <div class="settings-header">
          <span id="app-update-title"></span>
          <button class="settings-close" onclick="app.closeAppUpdate()" data-i18n-title="appUpdate.close" title="Close"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="app-update-body">
          <div id="app-update-current" class="settings-unit"></div>
          <div id="app-update-notes" class="app-update-notes"></div>
        </div>
        <div class="settings-footer">
          <button onclick="app.openAppUpdatePage()" data-i18n="appUpdate.openOnGitHub">Open on GitHub</button>
          <button id="app-update-install" class="btn-primary" onclick="app.installAppUpdate()" data-i18n="appUpdate.install">Update</button>
        </div>
      </div>
    </div>

    <div id="handler-update-overlay" class="settings-overlay" hidden>
      <div class="settings-modal app-update-modal" role="dialog" aria-labelledby="handler-update-title">
        <div class="settings-header">
          <span id="handler-update-title"></span>
          <button class="settings-close" onclick="app.closeHandlerUpdate()" data-i18n-title="handlerUpdate.later" title="Later"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
        </div>
        <div class="app-update-body">
          <div id="handler-update-current" class="settings-unit"></div>
          <div id="handler-update-notes" class="app-update-notes"></div>
        </div>
        <div class="settings-footer">
          <button onclick="app.closeHandlerUpdate()" data-i18n="handlerUpdate.later">Later</button>
          <button id="handler-update-restart" class="btn-primary" onclick="app.restartForHandlers()" data-i18n="handlerUpdate.restart">Restart now</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
